<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Anchor interaction studies</title><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="anchor-demos.css"><style>body{margin:0;background:#e8ece5;color:#193724;font-family:Geist,sans-serif}main{max-width:1120px;margin:auto;padding:32px 24px 80px}h1{font-weight:500;font-size:clamp(32px,5vw,56px);letter-spacing:-.03em}header p{max-width:65ch;line-height:1.6}header a{color:inherit}section{margin-top:64px}h2{font-weight:500;font-size:28px}.anchor-demo{background:#f6f7f5}nav{display:flex;flex-wrap:wrap;gap:12px}nav a{color:inherit;font-size:14px}button,summary,a,input{touch-action:manipulation}</style></head><body><main><header><a href="./#project/anchor-theme">Back to the Anchor case study</a><h1>Anchor interaction studies</h1><p>Populated, interactive adaptations of the supplied Shopify theme designs. Product data is illustrative. No forms, baskets or checkout actions connect to a store.</p><nav aria-label="Interaction studies"></nav></header><div id="studies"></div></main><script src="anchor-demos.js"></script><script>
const studies=[['fast-filters','Image-led collection shortcuts'],['search','Search'],['filters','Filters'],['horizontal-filters','Horizontal filters'],['products','Product cards'],['quick-buy','Quick buy'],['cart','Basket'],['navigation','Navigation'],['accordion','Product details'],['footer','Footer'],['motion','Original timeline exports']];
for(const [kind,title]of studies){const section=document.createElement('section');section.id=kind;const h=document.createElement('h2');h.textContent=title;section.append(h,window.createAnchorDemo(kind));document.querySelector('#studies').append(section);const a=document.createElement('a');a.href='#'+kind;a.textContent=title;document.querySelector('nav').append(a);}
</script></body></html>
